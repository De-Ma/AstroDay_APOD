name: Build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AstroDay.sln
      - name: Verify formatting
        run: dotnet format AstroDay.sln --verify-no-changes --no-restore
      - name: Build and test
        run: dotnet test AstroDay.sln --configuration Release --no-restore
